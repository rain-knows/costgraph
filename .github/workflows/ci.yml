name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试与静态检查
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: costgraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d costgraph_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: Ruff lint 与 format
        run: |
          ruff check .
          ruff format --check .

      - name: 执行数据库迁移
        env:
          COST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/costgraph_test
        run: python -m alembic upgrade head

      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          COST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/costgraph_test
          TEST_COST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/costgraph_test
        run: python -m pytest tests -q

  frontend:
    name: 前端测试与 bundle 门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Vitest
        run: npm test

      # 生产构建 + 初始 JavaScript 必须小于 500 KiB。
      - name: 生产构建与 bundle 门禁
        run: npm run test:bundle

  docs:
    name: 文档同步
    # check_docs_sync.ps1 使用反斜杠做路径分隔符（IBM 设计包 SHA-256 清单校验
    # 与 Markdown 扫描排除），只能在 Windows 运行；改成跨平台需要重写并重新验证，
    # 本轮不做。GitHub 托管的 windows-latest 自带 PowerShell 5.1。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 变更映射需要与基准 ref 比较；浅克隆拿不到 base，默认 depth 1 会让检查静默跳过。
          fetch-depth: 0

      - name: 文档同步检查
        shell: pwsh
        env:
          DOCS_SYNC_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: .\scripts\check_docs_sync.ps1

      - name: 空白错误检查
        shell: pwsh
        run: git diff --check
